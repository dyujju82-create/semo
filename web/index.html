<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="تطبيق لمشاهدة الأفلام والمسلسلات">
    
    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="INDEX">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    
    <title>تطبيق INDEX</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #120201;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #AB261D;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .header:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .logo:hover {
            transform: scale(1.1);
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 30px;
        }
        .feature {
            background-color: #250604;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            width: 200px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .feature:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            background-color: #3a0906;
        }
        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .button {
            background-color: #AB261D;
            color: white;
            border: 3px solid white;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 30px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .button:hover {
            background-color: #d42f24;
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        .movie-list {
            display: flex;
            overflow-x: auto;
            padding: 20px 0;
            margin-top: 40px;
            scrollbar-width: thin;
            scrollbar-color: #AB261D #250604;
        }
        .movie-list::-webkit-scrollbar {
            height: 8px;
        }
        .movie-list::-webkit-scrollbar-track {
            background: #250604;
            border-radius: 10px;
        }
        .movie-list::-webkit-scrollbar-thumb {
            background-color: #AB261D;
            border-radius: 10px;
        }
        .movie-card {
            min-width: 150px;
            margin: 0 10px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        .movie-card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
        }
        .movie-title {
            padding: 10px;
            background-color: #250604;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .features {
                flex-direction: column;
                align-items: center;
            }
            .feature {
                width: 80%;
                margin-bottom: 20px;
            }
        }
    </style>
    <script id="splash-screen-script">
        function removeSplashFromWeb() {
            document.getElementById("splash")?.remove();
            document.getElementById("splash-branding")?.remove();
            document.body.style.background = "transparent";
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>تطبيق INDEX</h1>
            <p>تطبيق لمشاهدة الأفلام والمسلسلات</p>
        </div>
        
        <img src="favicon.png" alt="شعار التطبيق" class="logo" id="app-logo">
        
        <h2>الميزات</h2>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🗂</div>
                <h3>مكتبة شاملة</h3>
                <p>الوصول إلى معظم الأفلام والمسلسلات</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🎥</div>
                <h3>تشغيل البث</h3>
                <p>تشغيل الأفلام والمسلسلات مباشرة</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">⏳</div>
                <h3>مزامنة تقدم المشاهدة</h3>
                <p>مزامنة تلقائية لتقدم التشغيل</p>
            </div>
        </div>
        
        <h2>أحدث الأفلام</h2>
        <div class="movie-list" id="movie-list">
            <!-- سيتم إضافة الأفلام هنا عبر JavaScript -->
        </div>
        
        <div class="button" id="download-button">تحميل التطبيق</div>
        
        <p style="margin-top: 50px;">تم تطوير التطبيق باستخدام Flutter</p>
    </div>
    
    <script>
        // بيانات الأفلام
        const movies = [
            { title: "الفيلم الأول", image: "favicon.png" },
            { title: "الفيلم الثاني", image: "favicon.png" },
            { title: "الفيلم الثالث", image: "favicon.png" },
            { title: "الفيلم الرابع", image: "favicon.png" },
            { title: "الفيلم الخامس", image: "favicon.png" },
            { title: "الفيلم السادس", image: "favicon.png" }
        ];
        
        // إضافة الأفلام إلى القائمة
        const movieList = document.getElementById('movie-list');
        movies.forEach(movie => {
            const movieCard = document.createElement('div');
            movieCard.className = 'movie-card';
            
            const img = document.createElement('img');
            img.src = movie.image;
            img.alt = movie.title;
            
            const title = document.createElement('div');
            title.className = 'movie-title';
            title.textContent = movie.title;
            
            movieCard.appendChild(img);
            movieCard.appendChild(title);
            movieList.appendChild(movieCard);
        });
        
        // إضافة تفاعل للزر
        const downloadButton = document.getElementById('download-button');
        downloadButton.addEventListener('click', function() {
            alert('سيتم توفير التطبيق قريباً!');
        });
        
        // تدوير الشعار
        const appLogo = document.getElementById('app-logo');
        appLogo.addEventListener('click', function() {
            this.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                this.style.transform = '';
            }, 1000);
        });
    </script>
</body>
</html>
